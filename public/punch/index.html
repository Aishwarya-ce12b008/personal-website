<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punching Bag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed arcade fight screen. Fighting-game HUD on top (the bag is the opponent), controls dock at the bottom. Single dark theme by choice. */
:root{
  --bg:#0e1015; --panel:rgba(14,16,21,.78); --line:rgba(255,255,255,.12);
  --ink:#f3f1ec; --muted:#a3a9b5;
  --glove:#e0352b; --glove-dk:#8e1913; --tape:#ffc83d; --calm:#4fd18b;
  --display:"Anton", Impact, "Arial Narrow", sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
.stage{position:relative;height:100%;overflow:hidden;cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;padding-top:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr minmax(0,560px) 1fr;align-items:start;gap:12px;pointer-events:none}
.brand{font-family:var(--display);font-size:clamp(18px,2.6vw,26px);line-height:1;text-transform:uppercase;letter-spacing:.02em}
.brand span{color:var(--glove)}
.brand small{display:block;font:600 11px var(--body);color:var(--muted);letter-spacing:0;text-transform:none;margin-top:4px}
.vs{display:flex;flex-direction:column;gap:6px;min-width:0}
.plate{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-family:var(--display);font-size:clamp(20px,3vw,30px);line-height:1;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pct{font:800 12px var(--body);color:var(--muted);letter-spacing:.1em;font-variant-numeric:tabular-nums;white-space:nowrap}
.health{position:relative;height:20px;border-radius:4px;background:#2a1513;border:2px solid #f3f1ec;box-shadow:0 0 0 2px #000, 0 6px 20px rgba(0,0,0,.5);overflow:hidden;transform:skewX(-14deg)}
.ghost,.fill{position:absolute;top:0;bottom:0;right:0;width:100%}
.ghost{background:#fff;opacity:.55;transition:width .8s ease .25s}
.fill{background:linear-gradient(180deg,#ffd76a,var(--tape) 45%,#d99a10);transition:width .12s ease, background .3s}
.fill.low{background:linear-gradient(180deg,#ff7a6e,var(--glove) 45%,var(--glove-dk))}
.coach{align-self:center;max-width:100%;text-align:center;font:700 13px var(--body);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;margin-top:4px;transition:transform .15s}
.coach.bump{transform:scale(1.07)}
.score{justify-self:end;text-align:right;display:flex;gap:16px}
.lbl{font:800 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.val{font-family:var(--display);font-size:clamp(24px,3.4vw,34px);line-height:1;font-variant-numeric:tabular-nums}

.combo{position:absolute;right:max(20px,env(safe-area-inset-right,0px));top:42%;text-align:right;pointer-events:none;opacity:0;transform:scale(.6) rotate(-6deg);transition:opacity .2s, transform .12s}
.combo.on{opacity:1;transform:scale(1) rotate(-6deg)}
.combo b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(48px,8vw,96px);line-height:.85;color:var(--tape);-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 var(--glove)}
.combo i{font:800 14px var(--body);font-style:normal;letter-spacing:.2em;text-transform:uppercase}
.rage{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 160px 40px rgba(224,53,43,.6)}
.rage.on{opacity:1;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:inset 0 0 220px 60px rgba(224,53,43,.75)}}

/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.dock > *{pointer-events:auto}
.field{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;backdrop-filter:blur(6px)}
.field > label:first-child{font:800 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
input[type=text]{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font:700 14px var(--body);width:190px;max-width:44vw}
.btnlike,button{white-space:nowrap;display:inline-block;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font:700 13px var(--body);cursor:pointer}
.file-btn:hover .btnlike,button:hover{background:rgba(255,255,255,.14)}
.file-btn:focus-within .btnlike{outline:2px solid var(--tape);outline-offset:2px}
input:focus-visible,button:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--ink);flex:none}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.keys{font:600 12px var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;backdrop-filter:blur(6px)}
.keys kbd{font:800 11px var(--body);background:rgba(255,255,255,.1);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--ink)}

/* K.O. */
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:radial-gradient(circle at 50% 45%,rgba(14,16,21,.55),rgba(14,16,21,.88));padding:16px}
.done h2{font-family:var(--display);font-weight:400;font-size:clamp(96px,22vw,220px);margin:0;line-height:.85;color:var(--tape);-webkit-text-stroke:4px #000;text-shadow:8px 8px 0 var(--glove);transform:rotate(-4deg);animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(3) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
.done p{margin:0;font:700 16px var(--body);max-width:36ch;text-wrap:balance}
.done button{background:var(--glove);border-color:var(--glove);font-size:15px;padding:12px 20px}

@media (max-width:640px){
  .hud{grid-template-columns:1fr auto;grid-template-areas:"brand score" "vs vs"}
  .brand{grid-area:brand}.score{grid-area:score}.vs{grid-area:vs}
  .brand small{display:none}
  .keys{display:none}
  .combo{top:auto;bottom:90px}
}
@media (prefers-reduced-motion:reduce){.rage.on{animation:none}.done h2{animation:none}}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="c" aria-label="Punching bag. Click or tap to punch."></canvas>
  <div class="rage" id="rage"></div>

  <div class="hud">
    <div class="brand">Punching <span>Bag</span><small>Name your nemesis. Ruin its day.</small></div>
    <div class="vs">
      <div class="plate"><span class="who"><img class="avatar" id="avatar" alt="" hidden><span class="name" id="foe">Nikhil</span></span><span class="pct" id="pct">HP 100</span></div>
      <div class="health"><div class="ghost" id="ghost"></div><div class="fill" id="fill"></div></div>
      <div class="coach" id="coach">Go on. That bag has been asking for it.</div>
    </div>
    <div class="score">
      <div><div class="lbl">Punches</div><div class="val" id="hits">0</div></div>
      <div><div class="lbl">Best combo</div><div class="val" id="best">0</div></div>
    </div>
  </div>

  <div class="combo" id="comboBox"><b id="combo">0</b><i>hit combo</i></div>

  <div class="dock">
    <div class="field">
      <label for="bagText">On the bag</label>
      <input type="text" id="bagText" maxlength="24" value="Nikhil">
      <label class="file-btn" for="faceFile"><span class="btnlike">Add face</span><input type="file" id="faceFile" accept="image/*" aria-label="Add a face photo to the bag"></label>
      <button id="clearFace" type="button" hidden>Remove face</button>
      <button id="mute" type="button" aria-pressed="false">Sound on</button>
    </div>
    <div class="keys">Tap to punch &nbsp; <kbd>F</kbd> <kbd>J</kbd> jabs &nbsp; <kbd>Space</kbd> haymaker</div>
  </div>

  <div class="done" id="done" hidden>
    <h2>K.O.</h2>
    <p id="doneMsg"></p>
    <button id="again" type="button">Somehow still mad. Go again</button>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('c'), ctx = cv.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { glove: css('--glove'), gloveDk: css('--glove-dk'), tape: css('--tape'), calm: css('--calm'), ink: css('--ink') };
const DISPLAY = css('--display');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- sizing + prerendered room ----------
let W = 0, H = 0, room = null;
function resize(){
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  room = buildRoom(dpr);
}
function geom(){
  const top = Math.min(150, H * 0.2);
  const bagH = Math.min(H * 0.56, 460, W * 0.9);
  const bagW = Math.min(bagH * 0.42, W * 0.34);
  const chain = top + Math.max(18, H * 0.05);
  const s = bagW / 120;
  return { ax: W / 2, ay: top - 30, chain, bagH, bagW, s, floor: Math.min(H - 70, chain + bagH + H * 0.16) };
}
function buildRoom(dpr){
  const off = document.createElement('canvas');
  off.width = cv.width; off.height = cv.height;
  const o = off.getContext('2d'); o.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = geom();
  // wall
  o.fillStyle = '#17191f'; o.fillRect(0, 0, W, H);
  const bw = 64, bh = 26;
  for (let y = 0, row = 0; y < g.floor; y += bh, row++){
    for (let x = (row % 2) * -bw / 2; x < W; x += bw){
      const v = 22 + ((x * 13 + y * 7) % 9);
      o.fillStyle = `rgb(${v + 6},${v},${v - 2})`;
      o.fillRect(x + 2, y + 2, bw - 4, bh - 4);
    }
  }
  // ring ropes behind
  [0.6, 0.72, 0.84].forEach((k, i) => {
    const y = g.floor - (g.floor - g.chain) * (1 - k) - 40;
    o.fillStyle = ['#b8261f', '#e9e4da', '#1f3f8f'][i];
    o.globalAlpha = 0.35; o.fillRect(0, y, W, 6); o.globalAlpha = 1;
  });
  // spotlight
  const sp = o.createRadialGradient(W / 2, g.chain, 20, W / 2, g.chain + g.bagH * 0.4, Math.max(W, H) * 0.65);
  sp.addColorStop(0, 'rgba(255,236,200,0.20)'); sp.addColorStop(0.5, 'rgba(255,236,200,0.05)'); sp.addColorStop(1, 'rgba(0,0,0,0.55)');
  o.fillStyle = sp; o.fillRect(0, 0, W, H);
  // ceiling beam
  o.fillStyle = '#0b0c10'; o.fillRect(0, 0, W, Math.max(6, g.ay));
  o.fillStyle = '#3a3d45'; o.fillRect(W / 2 - 40, g.ay - 6, 80, 10);
  // floor mat
  const fl = o.createLinearGradient(0, g.floor, 0, H);
  fl.addColorStop(0, '#1d4f8a'); fl.addColorStop(1, '#0c1f38');
  o.fillStyle = fl; o.fillRect(0, g.floor, W, H - g.floor);
  o.fillStyle = 'rgba(255,255,255,0.18)'; o.fillRect(0, g.floor, W, 2);
  o.strokeStyle = 'rgba(255,255,255,0.06)'; o.lineWidth = 1;
  for (let i = -10; i <= 10; i++){ o.beginPath(); o.moveTo(W / 2 + i * 40, g.floor); o.lineTo(W / 2 + i * 160, H); o.stroke(); }
  // vignette
  const vg = o.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  o.fillStyle = vg; o.fillRect(0, 0, W, H);
  return off;
}
new ResizeObserver(resize).observe(stage); resize();

// ---------- state ----------
const bag = { theta: 0, omega: 0, wobble: 0, flash: 0, dents: [] };
let parts = [], words = [], rings = [], shake = 0, t = 0, screenFlash = 0;
let hits = 0, combo = 0, best = 0, lastHit = 0, stress = 100, finished = false;
const gloves = { '-1': { anim: null }, '1': { anim: null } };
const WORDS = ['POW', 'WHAM', 'THUD', 'BAM', 'OOF', 'CRACK', 'BOOM', 'SMACK', 'TAKE THAT', 'NOT TODAY', 'SIT DOWN', 'UNSUBSCRIBE',
  'PER MY LAST PUNCH', 'CIRCLE BACK ON THIS', 'BLOCKED', 'NEW PHONE WHO DIS', 'MUTED', 'DECLINED', 'OUT OF OFFICE', 'NOPE', 'BYE', 'K.', 'THIS COULD HAVE BEEN AN EMAIL'];
const RAGE_WORDS = ['RAGE MODE', 'UNHINGED', 'SOMEBODY STOP HER', 'CALL HR', 'ABSOLUTELY FERAL', 'VIOLENCE (CORPORATE)'];
const COACH = {
  high: ['Go on. That bag has been asking for it.', 'Pretend it just said "quick question".', 'It scheduled a 6pm sync. Hit it.', 'It replied-all. You know what to do.'],
  mid: ['Oh, we are warming up now.', 'The bag is reconsidering its life choices.', 'Yes. Exactly that. Again.', 'That one had a deadline in it.'],
  low: ['It is BEGGING for mercy. Ignore it.', 'Almost there. Finish the job.', 'The bag wants to circle back. Deny.', 'One more and it files a complaint.'],
  idle: ['Is that it? It is laughing at you.', 'Hello? The bag is still smug.', 'It just added you to another meeting.', 'You are letting it win. Unacceptable.'],
  rage: ['RAGE MODE. Nobody is safe.', 'Somebody hold her earrings.', 'This is no longer cardio. This is personal.']
};
const pick = a => a[(Math.random() * a.length) | 0];
let rage = false, lastCoach = 0, lastAct = performance.now(), idleSaid = false;
function say(line){
  const el = $('coach');
  el.textContent = line; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 160);
}
const label = () => ($('bagText').value || '').trim();
$('bagText').addEventListener('input', () => { $('foe').textContent = label() || 'The Bag'; });
let face = null;
$('faceFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => { face = img; $('avatar').src = url; $('avatar').hidden = false; $('clearFace').hidden = false; say('Oh, it has a face now. Even better.'); };
  img.src = url; e.target.value = '';
});
$('clearFace').addEventListener('click', () => { face = null; $('avatar').hidden = true; $('clearFace').hidden = true; });

// ---------- helpers ----------
const ease = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x;
const lerp = (a, b, k) => a + (b - a) * k;
function rr(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function toScreen(g, lx, ly){
  const c = Math.cos(bag.theta), sn = Math.sin(bag.theta);
  return { x: g.ax + lx * c + ly * sn, y: g.ay - lx * sn + ly * c };
}
const narrow = () => W < 600;
const guardPos = (g, side) => ({ x: g.ax + side * (g.bagW / 2 + (narrow() ? 62 : 105) * g.s), y: g.chain + g.bagH * 0.72 });
const targetFor = (g, side, ly) => toScreen(g, side * g.bagW / 2, ly);

// ---------- sound ----------
let ac = null, muted = false, noiseBuf = null;
function thud(p){
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const now = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150 - Math.min(40, p * 15), now);
    o.frequency.exponentialRampToValueAtTime(42, now + 0.2);
    g.gain.setValueAtTime(Math.min(0.95, 0.45 + 0.2 * p), now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    o.connect(g).connect(ac.destination); o.start(now); o.stop(now + 0.3);
    if (!noiseBuf){
      const len = Math.floor(ac.sampleRate * 0.12);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    const n = ac.createBufferSource(); n.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700 + 350 * p;
    const ng = ac.createGain(); ng.gain.value = 0.8;
    n.connect(f).connect(ng).connect(ac.destination); n.start(now);
  } catch (e) {}
}

// ---------- punching ----------
function punch(side, ly, power){
  if (finished) return;
  gloves[side].anim = { p: 0, dur: power > 1.8 ? 0.3 : 0.19, ly, power, landed: false };
}

function land(side, ly, power){
  const g = geom();
  const now = performance.now();
  combo = (now - lastHit < 750) ? combo + 1 : 1;
  lastHit = now; best = Math.max(best, combo);
  const wasRage = rage;
  rage = combo >= 10;
  $('rage').classList.toggle('on', rage);
  const pw = power * (1 + Math.min(combo, 15) * 0.04) * (rage ? 1.5 : 1);
  hits++; lastAct = now; idleSaid = false;
  if (rage && !wasRage) { say(pick(COACH.rage)); lastCoach = now; }
  else if (now - lastCoach > 2600) { say(pick(stress > 66 ? COACH.high : stress > 30 ? COACH.mid : COACH.low)); lastCoach = now; }

  bag.omega += -side * 0.9 * pw * (0.6 + 0.6 * (ly - g.ay) / (g.chain + g.bagH - g.ay));
  bag.wobble = Math.min(1.2, bag.wobble + 0.45 * pw);
  bag.flash = Math.min(1, 0.35 * pw);
  bag.dents.push({ side, ly: ly - g.ay, life: 1, r: (18 + 8 * pw) * g.s });
  if (bag.dents.length > 8) bag.dents.shift();
  shake = reduce ? 0 : Math.min(rage ? 26 : 18, shake + 5 * pw);
  if (power > 1.8 && !reduce) screenFlash = 0.35;

  const pt = targetFor(g, side, ly - g.ay);
  rings.push({ x: pt.x, y: pt.y, r: 10 * g.s, life: 1, w: 3 + 2 * pw });
  const n = Math.round(12 + 8 * pw);
  for (let i = 0; i < n; i++){
    const a = (side < 0 ? Math.PI : 0) + (Math.random() - 0.5) * 2.4;
    const sp = (140 + Math.random() * 340) * (0.7 + 0.3 * pw);
    parts.push({ x: pt.x, y: pt.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 90, life: 1, size: 1.5 + Math.random() * 3.5,
      color: Math.random() < 0.4 ? C.tape : 'rgba(240,230,210,0.95)' });
  }
  const big = combo >= 5 && combo % 5 === 0;
  const txt = big ? (rage ? pick(RAGE_WORDS) : 'COMBO x' + combo) : pick(WORDS);
  if (words.length >= 3) words.shift();
  words.push({ x: pt.x - side * (60 + Math.random() * 40) * g.s, y: pt.y - (20 + Math.random() * 60) * g.s, vy: -60, life: 1,
    text: txt, size: (big ? 38 : (txt.length > 12 ? 22 : 30) + 6 * Math.min(pw, 2)) * Math.max(0.75, g.s),
    rot: (Math.random() - 0.5) * 0.3, burst: big || pw > 1.5 || Math.random() < 0.35, color: big ? C.tape : rage ? C.glove : C.ink });

  thud(pw);
  stress = Math.max(0, stress - 1.15 * pw);
  updateHud();
  if (stress <= 0 && !finished) finish();
}

let comboTimer = 0;
function updateHud(){
  $('hits').textContent = hits;
  $('best').textContent = best;
  const p = Math.ceil(stress);
  $('pct').textContent = 'HP ' + p;
  $('fill').style.width = p + '%';
  $('ghost').style.width = p + '%';
  $('fill').classList.toggle('low', p < 30);
  const box = $('comboBox');
  if (combo >= 3){
    $('combo').textContent = combo;
    box.classList.add('on');
    clearTimeout(comboTimer); comboTimer = setTimeout(() => box.classList.remove('on'), 900);
  }
}

function finish(){
  finished = true;
  const who = label() || 'The bag';
  $('doneMsg').textContent = who + ' is down. ' + hits + ' punches, best combo ' + best + '. Stress: 0%. Attitude: immaculate.';
  rage = false; $('rage').classList.remove('on');
  const g = geom();
  for (let i = 0; i < 120; i++){
    const a = Math.random() * Math.PI * 2, sp = 150 + Math.random() * 500;
    parts.push({ x: W / 2, y: g.chain + g.bagH / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 220, life: 1.5,
      size: 2 + Math.random() * 4, color: [C.tape, C.calm, C.glove][i % 3] });
  }
  bag.omega += (Math.random() < 0.5 ? -1 : 1) * 4;
  setTimeout(() => { $('done').hidden = false; }, 450);
}

$('again').addEventListener('click', () => {
  hits = 0; combo = 0; best = 0; stress = 100; finished = false;
  say('Round two. It came back for more, apparently.');
  $('done').hidden = true; updateHud();
});

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const g = geom();
  const ly = Math.max(g.chain + g.bagH * 0.12, Math.min(g.chain + g.bagH * 0.92, y));
  const center = toScreen(g, 0, ly - g.ay).x;
  const side = x < center ? -1 : 1;
  const strong = Math.abs(x - center) < g.bagW * 0.25;
  punch(side, ly, strong ? 1.35 : 1);
});

let alt = 1;
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.repeat && e.key === ' ') return;
  const g = geom();
  const mid = g.chain + g.bagH * (0.3 + Math.random() * 0.35);
  if (e.key === 'f' || e.key === 'F' || e.key === 'ArrowLeft'){ e.preventDefault(); punch(-1, mid, 1); }
  else if (e.key === 'j' || e.key === 'J' || e.key === 'ArrowRight'){ e.preventDefault(); punch(1, mid, 1); }
  else if (e.key === ' '){ e.preventDefault(); alt = -alt; punch(alt, g.chain + g.bagH * 0.28, 2.2); }
});

$('mute').addEventListener('click', e => {
  muted = !muted;
  e.currentTarget.textContent = muted ? 'Sound off' : 'Sound on';
  e.currentTarget.setAttribute('aria-pressed', String(muted));
});

// ---------- drawing ----------
function wrapLines(text, maxW, size){
  ctx.font = size + 'px ' + DISPLAY;
  const ws = text.toUpperCase().split(/\s+/).filter(Boolean);
  const lines = []; let cur = '';
  for (const w of ws){
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width <= maxW || !cur) cur = test; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawShadow(g){
  const bottom = toScreen(g, 0, g.chain + g.bagH - g.ay);
  const lift = Math.max(0, (g.floor - bottom.y) / H);
  ctx.fillStyle = 'rgba(0,0,0,' + Math.max(0.12, 0.5 - lift * 0.6).toFixed(3) + ')';
  ctx.beginPath(); ctx.ellipse(bottom.x, g.floor + 10, g.bagW * (0.6 + lift * 0.5), 10, 0, 0, Math.PI * 2); ctx.fill();
}

function drawBag(g){
  ctx.save();
  ctx.translate(g.ax, g.ay);
  ctx.rotate(-bag.theta);
  const s = g.s;
  // swivel + chain links
  ctx.fillStyle = '#5c6068'; ctx.beginPath(); ctx.arc(0, 4, 7 * s, 0, Math.PI * 2); ctx.fill();
  const top = g.chain - g.ay - 8 * s;
  ctx.lineWidth = 2.5 * s; ctx.strokeStyle = '#9da1a9';
  for (let i = 0; i < 4; i++){ ctx.beginPath(); ctx.ellipse(0, 12 * s + i * 9 * s, 3 * s, 5.5 * s, 0, 0, Math.PI * 2); ctx.stroke(); }
  const hub = 12 * s + 4 * 9 * s;
  [-1, -0.35, 0.35, 1].forEach(d => { ctx.beginPath(); ctx.moveTo(0, hub); ctx.lineTo(d * g.bagW * 0.36, top); ctx.stroke(); });

  const wob = 1 + Math.sin(t * 38) * 0.035 * bag.wobble;
  const w = g.bagW * wob, h = g.bagH, x = -w / 2, y = g.chain - g.ay;
  const rad = Math.min(w * 0.18, 20 * s);
  // body leather
  const lg = ctx.createLinearGradient(x, 0, x + w, 0);
  lg.addColorStop(0, '#3a110d'); lg.addColorStop(0.22, '#8d2219'); lg.addColorStop(0.45, '#c33a2c'); lg.addColorStop(0.62, '#a32a1f'); lg.addColorStop(1, '#360f0b');
  ctx.fillStyle = lg; rr(ctx, x, y, w, h, rad); ctx.fill();
  // panel seams + stitching
  ctx.save(); rr(ctx, x, y, w, h, rad); ctx.clip();
  [-0.28, 0.28].forEach(k => {
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2 * s;
    ctx.beginPath(); ctx.moveTo(k * w, y); ctx.lineTo(k * w, y + h); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,220,200,0.25)'; ctx.lineWidth = 1; ctx.setLineDash([3 * s, 4 * s]);
    ctx.beginPath(); ctx.moveTo(k * w + 3 * s, y); ctx.lineTo(k * w + 3 * s, y + h); ctx.stroke(); ctx.setLineDash([]);
  });
  // specular streak
  const sh = ctx.createLinearGradient(x, 0, x + w, 0);
  sh.addColorStop(0.3, 'rgba(255,255,255,0)'); sh.addColorStop(0.4, 'rgba(255,255,255,0.14)'); sh.addColorStop(0.5, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.fillRect(x, y, w, h);
  // top/bottom shading
  const vs = ctx.createLinearGradient(0, y, 0, y + h);
  vs.addColorStop(0, 'rgba(0,0,0,0.35)'); vs.addColorStop(0.12, 'rgba(0,0,0,0)'); vs.addColorStop(0.85, 'rgba(0,0,0,0)'); vs.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vs; ctx.fillRect(x, y, w, h);
  // dents
  bag.dents.forEach(d => {
    const dx = d.side * w * 0.38;
    const rg = ctx.createRadialGradient(dx, d.ly, 1, dx, d.ly, d.r * 1.7);
    rg.addColorStop(0, 'rgba(0,0,0,' + (0.55 * d.life).toFixed(3) + ')'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.ellipse(dx, d.ly, d.r * 1.2, d.r * 1.7, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
  // face
  if (face){
    const fr = Math.min(w * 0.4, h * 0.2), fy = y + h * 0.36;
    const sq = 1 + Math.sin(t * 38) * 0.08 * bag.wobble;
    ctx.save();
    ctx.translate(0, fy); ctx.scale(sq, 2 - sq);
    ctx.beginPath(); ctx.arc(0, 0, fr, 0, Math.PI * 2); ctx.closePath();
    ctx.save(); ctx.clip();
    const k = Math.max((fr * 2) / face.width, (fr * 2) / face.height);
    ctx.drawImage(face, -face.width * k / 2, -face.height * k / 2, face.width * k, face.height * k);
    if (bag.flash > 0.01){ ctx.fillStyle = 'rgba(255,40,30,' + (bag.flash * 0.45).toFixed(3) + ')'; ctx.fillRect(-fr, -fr, fr * 2, fr * 2); }
    bag.dents.forEach(d => {
      if (Math.abs(d.ly - fy) > fr) return;
      const rg = ctx.createRadialGradient(d.side * fr * 0.45, d.ly - fy, 1, d.side * fr * 0.45, d.ly - fy, fr * 0.45);
      rg.addColorStop(0, 'rgba(70,20,90,' + (0.55 * d.life).toFixed(3) + ')'); rg.addColorStop(1, 'rgba(70,20,90,0)');
      ctx.fillStyle = rg; ctx.fillRect(-fr, -fr, fr * 2, fr * 2);
    });
    ctx.restore();
    ctx.lineWidth = 4 * s; ctx.strokeStyle = '#f6efe2'; ctx.stroke();
    ctx.restore();
  }
  // caps
  ctx.fillStyle = '#1c0907'; rr(ctx, x - 3 * s, y - 4 * s, w + 6 * s, 16 * s, 6 * s); ctx.fill();
  rr(ctx, x - 3 * s, y + h - 12 * s, w + 6 * s, 16 * s, 6 * s); ctx.fill();
  // tape band
  ctx.fillStyle = C.tape; ctx.fillRect(x, y + h * 0.13, w, 9 * s);
  ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(x, y + h * 0.13 + 7 * s, w, 2 * s);
  // name plate
  const text = label();
  if (text){
    let size = Math.round(w * (face ? 0.22 : 0.3)), lines;
    do { lines = wrapLines(text, w * 0.8, size); size -= 2; } while ((lines.length > 3 || lines.some(l => ctx.measureText(l).width > w * 0.86)) && size > 10);
    size += 2; ctx.font = size + 'px ' + DISPLAY;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lh = size * 1.02, cy = y + h * (face ? 0.68 : 0.5) - (lines.length - 1) * lh / 2;
    lines.forEach((l, i) => {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillText(l, 2 * s, cy + i * lh + 2 * s);
      ctx.fillStyle = '#f6efe2'; ctx.fillText(l, 0, cy + i * lh);
    });
  }
  if (bag.flash > 0.01){
    ctx.fillStyle = 'rgba(255,245,230,' + (bag.flash * 0.4).toFixed(3) + ')';
    rr(ctx, x, y, w, h, rad); ctx.fill();
  }
  ctx.restore();
}

function drawGlove(g, side){
  const gl = gloves[side];
  const guard = guardPos(g, side);
  let pos, k = 0;
  if (gl.anim){
    const a = gl.anim, hitAt = 0.4;
    k = a.p < hitAt ? ease(a.p / hitAt) : 1 - easeIn((a.p - hitAt) / (1 - hitAt));
    const tgt = targetFor(g, side, a.ly - g.ay);
    pos = { x: lerp(guard.x, tgt.x - side * 6 * g.s, k), y: lerp(guard.y, tgt.y, k) };
  } else {
    pos = { x: guard.x, y: guard.y + Math.sin(t * 3.2 + side) * 5 * g.s };
  }
  const ang = side < 0 ? 0 : Math.PI;
  const tilt = side * -0.35 * (1 - k);
  const s = g.s * (narrow() ? 0.78 : 1.15);
  const dirx = Math.cos(ang + tilt), diry = Math.sin(ang + tilt);
  const wrist = { x: pos.x - dirx * 78 * s, y: pos.y - diry * 78 * s };
  const elbow = { x: side < 0 ? Math.min(wrist.x - 60 * s, W * 0.08) : Math.max(wrist.x + 60 * s, W * 0.92), y: H + 40 };
  // forearm (sleeve)
  const ag = ctx.createLinearGradient(wrist.x, wrist.y, elbow.x, elbow.y);
  ag.addColorStop(0, '#2b2f3a'); ag.addColorStop(1, '#14161c');
  ctx.strokeStyle = ag; ctx.lineCap = 'round'; ctx.lineWidth = 46 * s;
  ctx.beginPath(); ctx.moveTo(wrist.x, wrist.y);
  ctx.quadraticCurveTo(lerp(wrist.x, elbow.x, 0.5), wrist.y + 30 * s, elbow.x, elbow.y); ctx.stroke();

  ctx.save();
  ctx.translate(pos.x, pos.y);
  ctx.rotate(ang + tilt);
  if (side > 0) ctx.scale(1, -1);
  // cuff + lace strap
  ctx.fillStyle = '#f1ece2'; rr(ctx, -92 * s, -27 * s, 34 * s, 54 * s, 9 * s); ctx.fill();
  ctx.fillStyle = C.glove; ctx.fillRect(-80 * s, -27 * s, 9 * s, 54 * s);
  // glove body
  const gg = ctx.createRadialGradient(-20 * s, -16 * s, 4 * s, -34 * s, 0, 52 * s);
  gg.addColorStop(0, '#ff7a6b'); gg.addColorStop(0.45, C.glove); gg.addColorStop(1, C.gloveDk);
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.ellipse(-32 * s, -2 * s, 46 * s, 36 * s, 0, 0, Math.PI * 2); ctx.fill();
  // knuckle line
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2 * s;
  ctx.beginPath(); ctx.arc(-38 * s, -2 * s, 30 * s, -0.9, 0.9); ctx.stroke();
  // thumb
  const tg = ctx.createLinearGradient(0, 14 * s, 0, 36 * s);
  tg.addColorStop(0, '#c72a21'); tg.addColorStop(1, C.gloveDk);
  ctx.fillStyle = tg; ctx.beginPath(); ctx.ellipse(-44 * s, 26 * s, 24 * s, 11 * s, -0.15, 0, Math.PI * 2); ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.beginPath(); ctx.ellipse(-20 * s, -20 * s, 18 * s, 7 * s, -0.35, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function burstPath(r, n){
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++){
    const a = (i / (n * 2)) * Math.PI * 2, rr2 = i % 2 ? r * 0.62 : r;
    ctx.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
  }
  ctx.closePath();
}

function drawFx(){
  rings.forEach(r => {
    ctx.strokeStyle = 'rgba(255,240,210,' + (r.life * 0.8).toFixed(3) + ')';
    ctx.lineWidth = r.w * r.life; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
  });
  parts.forEach(p => {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  words.forEach(w => {
    ctx.save();
    ctx.translate(w.x, w.y); ctx.rotate(w.rot);
    const pop = w.life > 0.85 ? 1 + (w.life - 0.85) * 3 : 1;
    ctx.scale(pop, pop);
    ctx.globalAlpha = Math.max(0, Math.min(1, w.life * 1.6));
    ctx.font = Math.round(w.size) + 'px ' + DISPLAY;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (w.burst){
      const tw = ctx.measureText(w.text).width;
      ctx.save(); ctx.scale(Math.max(1, tw / (w.size * 1.4)), 1);
      ctx.fillStyle = C.glove; burstPath(w.size * 1.15, 10); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.restore();
    }
    ctx.lineWidth = 7; ctx.strokeStyle = '#0e1015'; ctx.lineJoin = 'round'; ctx.strokeText(w.text, 0, 0);
    ctx.fillStyle = w.burst ? C.tape : w.color; ctx.fillText(w.text, 0, 0);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
  const g = geom();

  bag.omega += -16 * Math.sin(bag.theta) * dt;
  bag.omega *= Math.exp(-1.1 * dt);
  bag.theta += bag.omega * dt;
  if (Math.abs(bag.theta) > 0.6){ bag.theta = Math.sign(bag.theta) * 0.6; bag.omega *= -0.3; }
  bag.wobble *= Math.exp(-4 * dt);
  bag.flash *= Math.exp(-14 * dt);
  bag.dents.forEach(d => d.life -= dt * 0.9);
  bag.dents = bag.dents.filter(d => d.life > 0);

  [-1, 1].forEach(side => {
    const a = gloves[side].anim; if (!a) return;
    a.p += dt / a.dur;
    if (!a.landed && a.p >= 0.4){ a.landed = true; land(side, a.ly, a.power); }
    if (a.p >= 1) gloves[side].anim = null;
  });

  parts.forEach(p => { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.life -= dt * 1.6; });
  parts = parts.filter(p => p.life > 0 && p.y < H + 20);
  words.forEach(w => { w.y += w.vy * dt; w.life -= dt * 1.25; });
  words = words.filter(w => w.life > 0);
  rings.forEach(r => { r.r += 260 * dt; r.life -= dt * 3; });
  rings = rings.filter(r => r.life > 0);
  shake *= Math.exp(-12 * dt);
  screenFlash *= Math.exp(-10 * dt);
  if (!finished && !idleSaid && now - lastAct > 4500){ idleSaid = true; say(pick(COACH.idle)); }
  if (rage && now - lastHit > 900){ rage = false; $('rage').classList.remove('on'); }

  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (room) ctx.drawImage(room, 0, 0, W, H);
  drawShadow(g);
  drawBag(g);
  drawGlove(g, -1);
  drawGlove(g, 1);
  drawFx();
  ctx.restore();
  if (screenFlash > 0.01){ ctx.fillStyle = 'rgba(255,250,240,' + screenFlash.toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}
updateHud();
requestAnimationFrame(frame);
})();
</script>
</body>
