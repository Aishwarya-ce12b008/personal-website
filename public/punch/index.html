<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punching Bag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen gym app. Stats bar on top, the bag stage fills everything else. Deliberately single dark theme (night gym). */
:root{
--bg:#13161d; --panel:#1b1f28; --line:#2b313d;
--ink:#eef0f3; --muted:#98a1b0;
--glove:#d8322b; --tape:#f2c14e; --calm:#5cc28a;
--display:"Anton", Impact, "Arial Narrow", sans-serif;
--body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--glove)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.stats{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:54px}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.val{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.meter{width:min(220px,46vw)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.fill{height:100%;width:100%;background:var(--glove);transition:width .15s ease, background-color .4s}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls label{font-size:12px;color:var(--muted)}
input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font:600 13px var(--body);width:180px;max-width:52vw}
input[type=text]:focus-visible,button:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 13px var(--body);cursor:pointer}
button:hover{border-color:var(--muted)}
.stage{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{font-size:12px;color:var(--muted);text-align:center}
.hint kbd{font:600 11px var(--body);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink)}
.coach{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;font:700 14px var(--body);background:rgba(19,22,29,.8);border:1px solid var(--line);border-radius:999px;padding:7px 14px;pointer-events:none;transition:transform .15s}
.coach.bump{transform:translateX(-50%) scale(1.08)}
.rage{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;box-shadow:inset 0 0 120px 30px rgba(216,50,43,.55)}
.rage.on{opacity:1}
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(19,22,29,.72);backdrop-filter:blur(3px);padding:16px}
.done h2{font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,80px);margin:0;line-height:1;text-transform:uppercase;color:var(--calm);text-wrap:balance}
.done p{margin:0;color:var(--ink);font-size:15px}
.done button{background:var(--glove);border-color:var(--glove);font-size:15px;padding:10px 18px}
</style>
<style>body{margin:0}</style>
</head>
<body>

<div class="app">
<header>
<div>
<h1>Punching <span>Bag</span></h1>
<div class="sub">Name your nemesis. Put it on the bag. Ruin its day.</div>
</div>
<div class="stats">
<div class="stat"><span class="lbl">Punches</span><span class="val" id="hits">0</span></div>
<div class="stat"><span class="lbl">Combo</span><span class="val" id="combo">0</span></div>
<div class="stat meter"><span class="lbl">Stress <span id="pct">100%</span></span><div class="bar"><div class="fill" id="fill"></div></div></div>
</div>
</header>
<div class="controls">
<label for="bagText">On the bag</label>
<input type="text" id="bagText" maxlength="28" value="Nikhil">
<button id="mute" type="button" aria-pressed="false">Sound on</button>
</div>
<div class="stage" id="stage">
<div class="rage" id="rage"></div>
<div class="coach" id="coach">Go on. That bag has been asking for it.</div>
<canvas id="c" aria-label="Punching bag. Click or tap to punch."></canvas>
<div class="done" id="done" hidden>
<h2>Flawless victory</h2>
<p id="doneMsg"></p>
<button id="again" type="button">Somehow still mad. Go again</button>
</div>
</div>
<div class="hint">Click or tap to punch. <kbd>F</kbd> left jab, <kbd>J</kbd> right jab, <kbd>Space</kbd> haymaker. Chain hits fast for a combo.</div>
</div>

<script>
(() => {
const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { glove: css('--glove'), tape: css('--tape'), calm: css('--calm'), ink: css('--ink') };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0;
function resize(){
const r = stage.getBoundingClientRect();
const dpr = Math.min(2, window.devicePixelRatio || 1);
W = r.width; H = r.height;
cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe(stage); resize();

function geom(){
const bagH = Math.min(H * 0.58, 400);
const bagW = Math.min(bagH * 0.46, W * 0.3);
const chain = Math.max(24, H * 0.1);
const s = bagW / 120;
return { ax: W / 2, ay: 0, chain, bagH, bagW, s, floor: H - 18 };
}

// ---------- state ----------
const bag = { theta: 0, omega: 0, wobble: 0, flash: 0, dents: [] };
let parts = [], words = [], shake = 0, t = 0;
let hits = 0, combo = 0, lastHit = 0, stress = 100, finished = false;
const gloves = { '-1': { anim: null }, '1': { anim: null } };
const WORDS = ['POW', 'WHAM', 'THUD', 'BAM', 'OOF', 'CRACK', 'BOOM', 'SMACK', 'TAKE THAT', 'NOT TODAY', 'SIT DOWN', 'UNSUBSCRIBE',
'PER MY LAST PUNCH', 'CIRCLE BACK ON THIS', 'BLOCKED', 'NEW PHONE WHO DIS', 'MUTED', 'DECLINED', 'OUT OF OFFICE', 'NOPE', 'BYE', 'K.', 'THIS COULD HAVE BEEN AN EMAIL'];
const RAGE_WORDS = ['RAGE MODE', 'UNHINGED', 'SOMEBODY STOP HER', 'CALL HR', 'ABSOLUTELY FERAL', 'VIOLENCE (CORPORATE)'];
const COACH = {
high: ['Go on. That bag has been asking for it.', 'Pretend it just said "quick question".', 'It scheduled a 6pm sync. Hit it.', 'It replied-all. You know what to do.'],
mid: ['Oh, we are warming up now.', 'The bag is reconsidering its life choices.', 'Yes. Exactly that. Again.', 'That one had a deadline in it.'],
low: ['It is BEGGING for mercy. Ignore it.', 'Almost there. Finish the job.', 'The bag wants to circle back. Deny.', 'One more and it files a complaint.'],
idle: ['Is that it? It is laughing at you.', 'Hello? The bag is still smug.', 'It just added you to another meeting.', 'You are letting it win. Unacceptable.'],
rage: ['RAGE MODE. Nobody is safe.', 'Somebody hold her earrings.', 'This is no longer cardio. This is personal.']
};
const pick = a => a[(Math.random() * a.length) | 0];
let rage = false, lastCoach = 0, lastAct = performance.now(), idleSaid = false;
function say(line){
const el = document.getElementById('coach');
el.textContent = line; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
setTimeout(() => el.classList.remove('bump'), 160);
}

// ---------- helpers ----------
const ease = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x;
const lerp = (a, b, k) => a + (b - a) * k;
function rr(x, y, w, h, r){
ctx.beginPath();
ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// bag point (local: lx across, ly down from anchor) -> screen
function toScreen(g, lx, ly){
const c = Math.cos(bag.theta), sn = Math.sin(bag.theta);
return { x: g.ax + lx * c + ly * sn, y: g.ay - lx * sn + ly * c };
}
function guardPos(g, side){
return { x: g.ax + side * (g.bagW / 2 + 95 * g.s), y: g.chain + g.bagH * 0.78 };
}
function targetFor(g, side, ly){
return toScreen(g, side * g.bagW / 2, ly);
}

// ---------- sound ----------
let ac = null, muted = false, noiseBuf = null;
function thud(p){
if (muted) return;
try {
ac = ac || new (window.AudioContext || window.webkitAudioContext)();
if (ac.state === 'suspended') ac.resume();
const now = ac.currentTime;
const o = ac.createOscillator(), g = ac.createGain();
o.type = 'sine';
o.frequency.setValueAtTime(150 - Math.min(40, p * 15), now);
o.frequency.exponentialRampToValueAtTime(42, now + 0.2);
g.gain.setValueAtTime(Math.min(0.95, 0.45 + 0.2 * p), now);
g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
o.connect(g).connect(ac.destination); o.start(now); o.stop(now + 0.3);
if (!noiseBuf){
const len = Math.floor(ac.sampleRate * 0.12);
noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
const d = noiseBuf.getChannelData(0);
for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
}
const n = ac.createBufferSource(); n.buffer = noiseBuf;
const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700 + 350 * p;
const ng = ac.createGain(); ng.gain.value = 0.8;
n.connect(f).connect(ng).connect(ac.destination); n.start(now);
} catch (e) {}
}

// ---------- punching ----------
function punch(side, ly, power){
if (finished) return;
const gl = gloves[side];
gl.anim = { p: 0, dur: power > 1.8 ? 0.3 : 0.2, ly, power, landed: false };
}

function land(side, ly, power){
const g = geom();
const now = performance.now();
combo = (now - lastHit < 750) ? combo + 1 : 1;
lastHit = now;
const wasRage = rage;
rage = combo >= 10;
document.getElementById('rage').classList.toggle('on', rage);
const pw = power * (1 + Math.min(combo, 15) * 0.04) * (rage ? 1.5 : 1);
hits++; lastAct = now; idleSaid = false;
if (rage && !wasRage) { say(pick(COACH.rage)); lastCoach = now; }
else if (now - lastCoach > 2600) { say(pick(stress > 66 ? COACH.high : stress > 30 ? COACH.mid : COACH.low)); lastCoach = now; }

bag.omega += -side * 1.25 * pw * (0.6 + 0.6 * ly / (g.chain + g.bagH));
bag.wobble = Math.min(1.2, bag.wobble + 0.45 * pw);
bag.flash = Math.min(1, 0.35 * pw);
bag.dents.push({ side, ly, life: 1, r: (18 + 8 * pw) * g.s });
if (bag.dents.length > 8) bag.dents.shift();
shake = reduce ? 0 : Math.min(rage ? 26 : 18, shake + 5 * pw);

const pt = targetFor(g, side, ly);
const n = Math.round(10 + 8 * pw);
for (let i = 0; i < n; i++){
const a = (side < 0 ? Math.PI : 0) + (Math.random() - 0.5) * 2.2;
const sp = (120 + Math.random() * 320) * (0.7 + 0.3 * pw);
parts.push({ x: pt.x, y: pt.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 1, size: 1.5 + Math.random() * 3.5,
color: Math.random() < 0.35 ? C.tape : 'rgba(230,220,200,0.9)' });
}
const big = combo >= 5 && combo % 5 === 0;
const txt = big ? (rage ? pick(RAGE_WORDS) : 'COMBO x' + combo) : pick(WORDS);
words.push({ x: pt.x - side * (40 + Math.random() * 30) * g.s, y: pt.y - 20, vy: -70, life: 1,
text: txt, size: (big ? 36 : (txt.length > 12 ? 20 : 26) + 8 * Math.min(pw, 2)) * Math.max(0.8, g.s),
rot: (Math.random() - 0.5) * 0.35, color: big ? C.tape : rage ? C.glove : C.ink });

thud(pw);
stress = Math.max(0, stress - 1.15 * pw);
updateHud();
if (stress <= 0 && !finished) finish();
}

function updateHud(){
document.getElementById('hits').textContent = hits;
document.getElementById('combo').textContent = combo;
const p = Math.ceil(stress);
document.getElementById('pct').textContent = p + '%';
const fill = document.getElementById('fill');
fill.style.width = p + '%';
fill.style.backgroundColor = p < 25 ? C.calm : p < 60 ? C.tape : C.glove;
}

function finish(){
finished = true;
const label = (document.getElementById('bagText').value || 'it').trim();
document.getElementById('doneMsg').textContent = hits + ' punches. "' + label + '" has been handled. Stress: 0%. Attitude: immaculate.';
rage = false; document.getElementById('rage').classList.remove('on');
const g = geom();
for (let i = 0; i < 90; i++){
const a = Math.random() * Math.PI * 2, sp = 150 + Math.random() * 450;
parts.push({ x: W / 2, y: g.chain + g.bagH / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, life: 1.4,
size: 2 + Math.random() * 4, color: [C.tape, C.calm, C.glove][i % 3] });
}
setTimeout(() => { document.getElementById('done').hidden = false; }, 500);
}

document.getElementById('again').addEventListener('click', () => {
hits = 0; combo = 0; stress = 100; finished = false; say('Round two. It came back for more, apparently.');
document.getElementById('done').hidden = true; updateHud();
});

// pointer: punch toward wherever you tap, from the nearer side
cv.addEventListener('pointerdown', e => {
e.preventDefault();
const r = cv.getBoundingClientRect();
const x = e.clientX - r.left, y = e.clientY - r.top;
const g = geom();
const ly = Math.max(g.chain + g.bagH * 0.12, Math.min(g.chain + g.bagH * 0.92, y));
const center = toScreen(g, 0, ly).x;
const side = x < center ? -1 : 1;
const strong = Math.abs(x - center) < g.bagW * 0.25;
punch(side, ly, strong ? 1.35 : 1);
});

let alt = 1;
window.addEventListener('keydown', e => {
if (e.target && e.target.tagName === 'INPUT') return;
const g = geom();
const mid = g.chain + g.bagH * (0.35 + Math.random() * 0.3);
if (e.key === 'f' || e.key === 'F' || e.key === 'ArrowLeft'){ e.preventDefault(); punch(-1, mid, 1); }
else if (e.key === 'j' || e.key === 'J' || e.key === 'ArrowRight'){ e.preventDefault(); punch(1, mid, 1); }
else if (e.key === ' '){ e.preventDefault(); alt = -alt; punch(alt, g.chain + g.bagH * 0.3, 2.2); }
});

document.getElementById('mute').addEventListener('click', e => {
muted = !muted;
e.currentTarget.textContent = muted ? 'Sound off' : 'Sound on';
e.currentTarget.setAttribute('aria-pressed', String(muted));
});

// ---------- drawing ----------
function drawRoom(g){
const sp = ctx.createRadialGradient(W / 2, -H * 0.1, 10, W / 2, H * 0.2, Math.max(W, H) * 0.8);
sp.addColorStop(0, '#3a3a3c'); sp.addColorStop(0.45, '#20242d'); sp.addColorStop(1, '#14171e');
ctx.fillStyle = sp; ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#0f1116'; ctx.fillRect(0, g.floor, W, H - g.floor);
ctx.fillStyle = 'rgba(242,193,78,0.12)'; ctx.fillRect(0, g.floor, W, 2);
// shadow
const bottom = toScreen(g, 0, g.chain + g.bagH);
const lift = (g.floor - bottom.y) / H;
ctx.fillStyle = 'rgba(0,0,0,' + (0.45 - lift * 0.3).toFixed(3) + ')';
ctx.beginPath(); ctx.ellipse(bottom.x, g.floor + 4, g.bagW * (0.55 + lift * 0.3), 7, 0, 0, Math.PI * 2); ctx.fill();
}

function wrapLines(text, maxW, size){
ctx.font = size + 'px ' + css('--display');
const ws = text.toUpperCase().split(/\s+/).filter(Boolean);
const lines = []; let cur = '';
for (const w of ws){
const test = cur ? cur + ' ' + w : w;
if (ctx.measureText(test).width <= maxW || !cur) cur = test; else { lines.push(cur); cur = w; }
}
if (cur) lines.push(cur);
return lines;
}

function drawBag(g){
ctx.save();
ctx.translate(g.ax, g.ay);
ctx.rotate(-bag.theta);
// chains
ctx.strokeStyle = '#8b8f97'; ctx.lineWidth = 3 * g.s;
const top = g.chain - 10 * g.s;
[-1, 1].forEach(d => { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(d * g.bagW * 0.38, top); ctx.stroke(); });
ctx.fillStyle = '#6f737b'; ctx.beginPath(); ctx.arc(0, 6, 6 * g.s, 0, Math.PI * 2); ctx.fill();

const wob = 1 + Math.sin(t * 38) * 0.035 * bag.wobble;
const w = g.bagW * wob, h = g.bagH, x = -w / 2, y = g.chain;
// body
const lg = ctx.createLinearGradient(x, 0, x + w, 0);
lg.addColorStop(0, '#3e1d16'); lg.addColorStop(0.3, '#8a3a2a'); lg.addColorStop(0.55, '#a0473a'); lg.addColorStop(1, '#3a1a14');
ctx.fillStyle = lg; rr(x, y, w, h, Math.min(w * 0.42, 40 * g.s)); ctx.fill();
// top cap
ctx.fillStyle = '#2a1410'; rr(x - 2, y - 6 * g.s, w + 4, 18 * g.s, 8 * g.s); ctx.fill();
// tape bands
ctx.fillStyle = C.tape;
ctx.globalAlpha = 0.85;
ctx.fillRect(x, y + h * 0.1, w, 7 * g.s);
ctx.fillRect(x, y + h * 0.86, w, 7 * g.s);
ctx.globalAlpha = 1;
// seam
ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([4 * g.s, 4 * g.s]);
ctx.beginPath(); ctx.moveTo(0, y + h * 0.14); ctx.lineTo(0, y + h * 0.84); ctx.stroke(); ctx.setLineDash([]);
// label
const label = (document.getElementById('bagText').value || '').trim();
if (label){
let size = Math.round(w * 0.3), lines;
do { lines = wrapLines(label, w * 0.78, size); size -= 2; } while ((lines.length > 3 || lines.some(l => ctx.measureText(l).width > w * 0.84)) && size > 10);
size += 2; ctx.font = size + 'px ' + css('--display');
ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
ctx.fillStyle = 'rgba(245,238,228,0.88)';
const lh = size * 1.05, cy = y + h * 0.48 - (lines.length - 1) * lh / 2;
lines.forEach((l, i) => ctx.fillText(l, 0, cy + i * lh));
}
// dents
bag.dents.forEach(d => {
const dx = d.side * w * 0.36;
const rg = ctx.createRadialGradient(dx, d.ly, 1, dx, d.ly, d.r * 1.6);
rg.addColorStop(0, 'rgba(0,0,0,' + (0.5 * d.life).toFixed(3) + ')'); rg.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = rg; ctx.beginPath(); ctx.ellipse(dx, d.ly, d.r * 1.1, d.r * 1.6, 0, 0, Math.PI * 2); ctx.fill();
});
if (bag.flash > 0.01){
ctx.fillStyle = 'rgba(255,240,220,' + (bag.flash * 0.35).toFixed(3) + ')';
rr(x, y, w, h, Math.min(w * 0.42, 40 * g.s)); ctx.fill();
}
ctx.restore();
}

function drawGlove(g, side){
const gl = gloves[side];
const guard = guardPos(g, side);
let pos = guard, k = 0;
if (gl.anim){
const a = gl.anim;
const hitAt = 0.4;
k = a.p < hitAt ? ease(a.p / hitAt) : 1 - easeIn((a.p - hitAt) / (1 - hitAt));
const tgt = targetFor(g, side, a.ly);
pos = { x: lerp(guard.x, tgt.x - side * 4 * g.s, k), y: lerp(guard.y, tgt.y, k) };
} else {
pos = { x: guard.x, y: guard.y + Math.sin(t * 3 + side) * 4 * g.s };
}
const ang = side < 0 ? 0 : Math.PI;
const tilt = side * -0.25 * (1 - k);
const s = g.s * 1.05;
// arm to bottom corner
const back = { x: pos.x - Math.cos(ang + tilt) * 70 * s, y: pos.y - Math.sin(ang + tilt) * 70 * s };
ctx.strokeStyle = '#2f3542'; ctx.lineCap = 'round'; ctx.lineWidth = 38 * s;
ctx.beginPath(); ctx.moveTo(back.x, back.y);
ctx.quadraticCurveTo(back.x - side * 60 * s * -1, H, side < 0 ? -40 : W + 40, H + 60); ctx.stroke();

ctx.save();
ctx.translate(pos.x, pos.y);
ctx.rotate(ang + tilt);
if (side > 0) ctx.scale(1, -1);
// cuff
ctx.fillStyle = '#ece6da'; rr(-82 * s, -26 * s, 30 * s, 52 * s, 8 * s); ctx.fill();
ctx.fillStyle = C.tape; ctx.fillRect(-72 * s, -26 * s, 8 * s, 52 * s);
// glove body
const gg = ctx.createRadialGradient(-22 * s, -14 * s, 4 * s, -32 * s, 0, 46 * s);
gg.addColorStop(0, '#ff6a5a'); gg.addColorStop(0.5, C.glove); gg.addColorStop(1, '#7d1612');
ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(-30 * s, 0, 42 * s, 34 * s, 0, 0, Math.PI * 2); ctx.fill();
// thumb
ctx.fillStyle = '#9c1f1a'; ctx.beginPath(); ctx.ellipse(-40 * s, 24 * s, 20 * s, 10 * s, -0.2, 0, Math.PI * 2); ctx.fill();
// shine
ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.ellipse(-18 * s, -15 * s, 16 * s, 7 * s, -0.3, 0, Math.PI * 2); ctx.fill();
ctx.restore();
}

function drawFx(){
parts.forEach(p => {
ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
});
ctx.globalAlpha = 1;
words.forEach(w => {
ctx.save();
ctx.translate(w.x, w.y); ctx.rotate(w.rot);
const pop = w.life > 0.85 ? 1 + (w.life - 0.85) * 3 : 1;
ctx.scale(pop, pop);
ctx.globalAlpha = Math.max(0, Math.min(1, w.life * 1.6));
ctx.font = Math.round(w.size) + 'px ' + css('--display');
ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
ctx.lineWidth = 6; ctx.strokeStyle = '#13161d'; ctx.strokeText(w.text, 0, 0);
ctx.fillStyle = w.color; ctx.fillText(w.text, 0, 0);
ctx.restore();
});
ctx.globalAlpha = 1;
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
const g = geom();

// pendulum
bag.omega += -16 * Math.sin(bag.theta) * dt;
bag.omega *= Math.exp(-1.1 * dt);
bag.theta += bag.omega * dt;
if (Math.abs(bag.theta) > 0.75){ bag.theta = Math.sign(bag.theta) * 0.75; bag.omega *= -0.3; }
bag.wobble *= Math.exp(-4 * dt);
bag.flash *= Math.exp(-14 * dt);
bag.dents.forEach(d => d.life -= dt * 0.9);
bag.dents = bag.dents.filter(d => d.life > 0);

[-1, 1].forEach(side => {
const a = gloves[side].anim; if (!a) return;
a.p += dt / a.dur;
if (!a.landed && a.p >= 0.4){ a.landed = true; land(side, a.ly, a.power); }
if (a.p >= 1) gloves[side].anim = null;
});

parts.forEach(p => { p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.life -= dt * 1.6; });
parts = parts.filter(p => p.life > 0 && p.y < H + 20);
words.forEach(w => { w.y += w.vy * dt; w.life -= dt * 1.3; });
words = words.filter(w => w.life > 0);
shake *= Math.exp(-12 * dt);
if (!finished && !idleSaid && now - lastAct > 4500){ idleSaid = true; say(pick(COACH.idle)); }
if (rage && performance.now() - lastHit > 900){ rage = false; document.getElementById('rage').classList.remove('on'); }

ctx.save();
ctx.clearRect(0, 0, W, H);
if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
drawRoom(g);
drawBag(g);
drawGlove(g, -1);
drawGlove(g, 1);
drawFx();
ctx.restore();
requestAnimationFrame(frame);
}
updateHud();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
